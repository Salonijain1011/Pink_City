<form method="POST">
    {% csrf_token %}
    <label for="file_url">Google Drive File URL:</label>
    <input type="text" name="file_url" id="file_url" required placeholder="Enter the Google Drive file link">
    <button type="submit">Link File</button>
</form>

{% if error %}
    <p style="color: red;">{{ error }}</p>
{% endif %}
