{% extends 'base.html' %}

{% block title %}Delete Service{% endblock %}

{% block content %}

<h2>Are you sure you want to delete this service?</h2>
<p>Service Type: {{ service.service_type }}</p>
<p>Description: {{ service.description }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit"  class="btn btn-primary">Delete</button>
    <a href="{% url 'services' %}" class="btn btn-secondary">Cancel</a>
</form>

<style> 

    body, html {
        overflow-x: hidden;
      }
    .delete-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: 50px;
    }
    
    h2 {
        color:  #0d6efd; 
        font-weight: bold;
        margin-bottom: 20px;
    }
    
    .delete-container p {
        margin-bottom: 10px;
        font-size: 1.1em;
    }
    
    .delete-form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    
    .delete-form button,
    .delete-form a {
        margin: 10px 0;
        padding: 10px 20px;
        font-size: 1em;
        border: none;
        text-decoration: none;
        cursor: pointer;
    }
    
    .btn-delete {
        background-color: #d9534f; 
        color: white;
        border-radius: 5px;
    }
    
    .btn-cancel {
        background-color: #f0f0f0; 
        color: black;
        border-radius: 5px;
        text-align: center;
    }
    
    </style> 
    {%endblock%}
