{% extends 'base.html' %}

{% block title %}Edit Post{% endblock %}

{% block content %}

<form method="POST">
    {% csrf_token %}
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" value="{{ post.title }}" required><br>
    
    <label for="category">Category:</label>
    <input type="text" id="category" name="category" value="{{ post.category }}" required><br>


    <label for="date">Date:</label>
    <input type="date" id="id_date" name="date" value="{{ post.date|date:"Y-m-d" }}" required>

    <label for="description">Description:</label>
    <textarea id="description" name="description" required>{{ post.description }}</textarea><br>

    <button type="submit">Save Changes</button>
</form>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("id_date").setAttribute("min", today);
</script>

<style>

    body, html {
        overflow-x: hidden;
      }

/* General body styling */
body {
    font-family: Arial, sans-serif;
    background-color: #ffffff;
    margin: 0;
    padding: 0;
    padding-top: 5px; /* Adjust based on navbar height */
}

/* Form container styling */
form {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 400px;
    margin: 50px auto 0; /* Center the form horizontally */
}

/* Form label styling */
label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
    color: #333;
}

/* Input and textarea styling */
input[type="text"],
input[type="date"],
textarea {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    background-color: #f9f9f9;
}

/* Textarea styling */
textarea {
    height: 100px;
    resize: none;
}

/* Submit button styling */
button {
    background-color:  #0d6efd;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
}

/* Submit button hover effect */
button:hover {
    background-color: #0b5ed7;
}
</style>

{% endblock %}
