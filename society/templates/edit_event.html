{% extends 'base.html' %}

{% block title %}Edit Event{% endblock %}

{% block content %}
    
<form method="POST">
    {% csrf_token %}
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" value="{{ event.title }}" required><br>
    

    <label for="location">Location:</label>
   <div id="geocoder" class="geocoder"></div>
   <input type="hidden" id="location-input" name="location" required>
   <input type="hidden" id="longitude-input" name="longitude">
   <input type="hidden" id="latitude-input" name="latitude">

    <label for="date">Date:</label>
    <input type="date" id="id_date" name="date" required>

    <label for="description">Description:</label>
    <textarea id="description" name="description" required>{{ event.description }}</textarea><br>

    <button type="submit">Save Changes</button>
</form>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.css" type="text/css">

    <script>
    const mapboxAccessToken = "{{ mapbox_access_token }}";
    mapboxgl.accessToken = mapboxAccessToken;
    const geocoder = new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        mapboxgl: mapboxgl,
        placeholder: "Search for event location",
        proximity: {
            longitude: 76.6,
            latitude: 27.02
        }
    });

    geocoder.on('result', (e) => {
        document.getElementById('location-input').value = e.result.place_name; 
        document.getElementById('longitude-input').value = e.result.geometry.coordinates[0]; 
        document.getElementById('latitude-input').value = e.result.geometry.coordinates[1];  
    });
    document.getElementById('geocoder').appendChild(geocoder.onAdd());

const today = new Date().toISOString().split('T')[0];
document.getElementById("id_date").setAttribute("min", today);
</script>

<style>
    /* General body styling */
    body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 0;
        padding-top: 5px; /* Adjust based on navbar height */
    }

/* Form container styling */
form {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 400px;
    margin: 50px auto 0; /* Center the form horizontally */
}

/* Form label styling */
label {
display: block;
font-size: 14px;
font-weight: bold;
margin-bottom: 6px;
color: #333;
}

/* Input and textarea styling */
input[type="text"],
input[type="date"],
textarea {
width: 100%;
padding: 8px;
margin-bottom: 15px;
border: 1px solid #ccc;
border-radius: 4px;
font-size: 14px;
background-color: #f9f9f9;
}

/* Textarea styling */
textarea {
height: 100px;
resize: none;
}

/* Submit button styling */
button {
background-color:  #0d6efd;
color: white;
border: none;
padding: 10px 20px;
border-radius: 4px;
font-size: 16px;
cursor: pointer;
transition: background-color 0.3s;
}

/* Submit button hover effect */
button:hover {
background-color: #0b5ed7;
}

</style>
{%endblock%}
